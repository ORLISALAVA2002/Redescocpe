<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REDESCOCPE | Paso 2: Agendar Cita y Gestión</title>
  <!-- ICONO PESTAÑA (FAVICON) -->
  <link rel="icon" href="1-Photoroom.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 py-8 px-4">

  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- TARJETA DE AGENDAMIENTO -->
    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-gray-100">
      
      <!-- CABECERA ENCABEZADO REDESCOCPE -->
      <div class="flex flex-col items-center mb-6 pb-4 border-b border-gray-100 text-center">
        <!-- IMAGEN MÁS GRANDE AQUÍ (h-32 md:h-40) -->
        <img src="1-Photoroom.png" alt="REDESCOCPE Quinindé" class="h-32 md:h-40 object-contain mb-4">
        <span class="text-xs font-bold text-blue-700 uppercase tracking-wider bg-blue-100 px-3 py-1 rounded-full mb-2">REDESCOCPE - Paso 2 de 2</span>
        <h1 class="text-2xl font-bold text-gray-950">Agendar Inspección Técnica</h1>
      </div>

      <!-- RESUMEN DEL PRODUCTOR SELECCIONADO -->
      <div id="resumenProductor" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-xl text-sm text-green-900 leading-relaxed"></div>

      <form onsubmit="confirmarCitaFinal(event)" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Visita <span class="text-red-500">*</span></label>
            <input type="date" id="fechaVisita" required onchange="validarAlertas()" class="w-full px-4 py-2.5 bg-white border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Jornada <span class="text-red-500">*</span></label>
            <select id="jornada" required class="w-full px-4 py-2.5 bg-white border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
              <option value="">Seleccione horario...</option>
              <option value="Mañana (08:00 - 12:00)">Mañana (08:00 - 12:00)</option>
              <option value="Tarde (13:00 - 17:00)">Tarde (13:00 - 17:00)</option>
            </select>
          </div>
        </div>

        <!-- CONTENEDOR DE ALERTAS AUTOMÁTICAS -->
        <div id="boxAlerta" class="hidden p-4 rounded-xl text-sm"></div>

        <div class="flex gap-4">
          <a href="index.html" class="w-1/3 text-center bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-3.5 rounded-xl transition">
            ⬅️ Volver
          </a>
          <button type="submit" id="btnGuardar" class="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl shadow-md transition">
            💾 Guardar Cita
          </button>
        </div>
      </form>
    </div>

    <!-- TABLA DE CONTROL / BASE DE DATOS -->
    <div class="bg-white p-6 rounded-2xl shadow-lg border border-gray-100">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-gray-800">📊 Agenda Registrada - REDESCOCPE</h2>
        <span class="text-xs bg-gray-100 px-3 py-1 rounded-full text-gray-600">Sincronizado con Google Sheets</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left text-gray-600 border">
          <thead class="bg-gray-100 uppercase text-gray-700">
            <tr>
              <th class="p-2 border">Fecha</th>
              <th class="p-2 border">Jornada</th>
              <th class="p-2 border">Productor</th>
              <th class="p-2 border">Finca / Ubicación</th>
              <th class="p-2 border text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaCitas"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbyNtpfKKZZXb8V9btyXjM86vEf_BOEHbCRzjjnfZ-UTH1GCDEqO8VUuV9nh9_obHLUVrA/exec"; 
    
    const MAX_VISITAS_POR_DIA = 5;
    let productorActual = null;
    let editandoId = null;

    window.onload = function() {
      const datos = localStorage.getItem('productorTemporal');
      if (!datos) {
        alert("Primero debe llenar los datos del productor.");
        window.location.href = "index.html";
        return;
      }
      productorActual = JSON.parse(datos);
      
      document.getElementById('resumenProductor').innerHTML = `
        👤 <strong>Productor:</strong> ${productorActual.nombre} | C.I: ${productorActual.cedula} | Tel: ${productorActual.telefono}<br>
        🧬 <strong>Etnia:</strong> ${productorActual.etnia} | <strong>Sexo:</strong> ${productorActual.sexo} | <strong>F. Nacimiento:</strong> ${productorActual.fechaNacimiento}<br>
        🏡 <strong>Finca:</strong> ${productorActual.finca} (${productorActual.hectareas} Ha) | <strong>Cacao:</strong> ${productorActual.tipoCacao}<br>
        📍 <strong>Ubicación:</strong> ${productorActual.provincia}, ${productorActual.canton}, ${productorActual.parroquia} (${productorActual.sector})
      `;

      cargarTablaBD();
    };

    function validarAlertas() {
      const fecha = document.getElementById('fechaVisita').value;
      const alertBox = document.getElementById('boxAlerta');
      const btnGuardar = document.getElementById('btnGuardar');
      
      alertBox.classList.add('hidden');
      btnGuardar.disabled = false;
      if (!fecha) return;

      let baseDatos = JSON.parse(localStorage.getItem('baseDatosVisitas')) || [];
      const citasMismoDia = baseDatos.filter(c => c.fechaVisita === fecha && c.id !== editandoId);

      if (citasMismoDia.length >= MAX_VISITAS_POR_DIA) {
        alertBox.classList.remove('hidden');
        alertBox.className = "p-4 bg-red-100 border border-red-300 text-red-800 rounded-xl text-sm font-medium";
        alertBox.innerHTML = `🚨 <strong>¡DÍA LLENO!</strong> Ya existen ${citasMismoDia.length} visitas agendadas para el ${fecha}. Por favor elige otra fecha.`;
        btnGuardar.disabled = true;
        return;
      }

      const sectorActual = (productorActual.sector || "").toLowerCase();
      const citaCercana = citasMismoDia.find(c => (c.sector || "").toLowerCase().includes(sectorActual));

      if (citaCercana) {
        alertBox.classList.remove('hidden');
        alertBox.className = "p-4 bg-green-100 border border-green-300 text-green-800 rounded-xl text-sm font-medium";
        alertBox.innerHTML = `🟢 <strong>¡Excelente Ruta!</strong> Este mismo día vas a estar en el sector <em>"${citaCercana.sector}"</em> visitando a <strong>${citaCercana.nombre}</strong>. ¡Aprovechas el viaje!`;
      } else if (citasMismoDia.length > 0) {
        alertBox.classList.remove('hidden');
        alertBox.className = "p-4 bg-yellow-100 border border-yellow-300 text-yellow-800 rounded-xl text-sm font-medium";
        alertBox.innerHTML = `⚠️ <strong>Nota:</strong> Ya tienes ${citasMismoDia.length} visita(s) en otros sectores ese día. Revisa si la distancia te conviene.`;
      }
    }

    function confirmarCitaFinal(event) {
      event.preventDefault();

      const registroCompleto = {
        ...productorActual,
        fechaVisita: document.getElementById('fechaVisita').value,
        jornada: document.getElementById('jornada').value,
        id: editandoId || Date.now(),
        action: editandoId ? "editar" : "nuevo"
      };

      let baseDatos = JSON.parse(localStorage.getItem('baseDatosVisitas')) || [];

      if (editandoId) {
        baseDatos = baseDatos.map(item => item.id === editandoId ? registroCompleto : item);
        editandoId = null;
      } else {
        baseDatos.push(registroCompleto);
      }

      localStorage.setItem('baseDatosVisitas', JSON.stringify(baseDatos));

      fetch(GOOGLE_SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(registroCompleto)
      });

      alert("🎉 ¡Registro de REDESCOCPE guardado con éxito! Redirigiendo a la página principal...");

      localStorage.removeItem('productorTemporal');
      window.location.href = "index.html";
    }

    function cargarTablaBD() {
      let baseDatos = JSON.parse(localStorage.getItem('baseDatosVisitas')) || [];
      const tbody = document.getElementById('tablaCitas');
      tbody.innerHTML = "";

      baseDatos.forEach(reg => {
        tbody.innerHTML += `
          <tr class="border-b hover:bg-gray-50">
            <td class="p-2 border font-bold text-blue-600">${reg.fechaVisita}</td>
            <td class="p-2 border">${reg.jornada}</td>
            <td class="p-2 border">${reg.nombre}</td>
            <td class="p-2 border">${reg.finca} (${reg.provincia}, ${reg.canton})</td>
            <td class="p-2 border text-center space-x-1">
              <button onclick="editarRegistro(${reg.id})" class="px-2 py-1 bg-yellow-500 text-white rounded text-xs hover:bg-yellow-600">✏️ Editar</button>
              <button onclick="eliminarRegistro(${reg.id})" class="px-2 py-1 bg-red-600 text-white rounded text-xs hover:bg-red-700">🗑️ Eliminar</button>
            </td>
          </tr>
        `;
      });
    }

    function editarRegistro(id) {
      let baseDatos = JSON.parse(localStorage.getItem('baseDatosVisitas')) || [];
      const item = baseDatos.find(reg => reg.id === id);
      if (item) {
        editandoId = item.id;
        document.getElementById('fechaVisita').value = item.fechaVisita;
        document.getElementById('jornada').value = item.jornada;
        validarAlertas();
      }
    }

    function eliminarRegistro(id) {
      if (confirm("¿Estás seguro de que deseas eliminar esta cita de la agenda y de Google Sheets?")) {
        let baseDatos = JSON.parse(localStorage.getItem('baseDatosVisitas')) || [];
        const itemAEliminar = baseDatos.find(reg => reg.id === id);
        baseDatos = baseDatos.filter(reg => reg.id !== id);
        
        localStorage.setItem('baseDatosVisitas', JSON.stringify(baseDatos));

        if (itemAEliminar) {
          fetch(GOOGLE_SHEET_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: "eliminar", cedula: itemAEliminar.cedula })
          });
        }

        cargarTablaBD();
      }
    }
  </script>
</body>
</html>
